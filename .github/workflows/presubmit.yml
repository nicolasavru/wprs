name: presubmit
on: [push, pull_request, workflow_call, workflow_dispatch]

env:
  # Without this, tracy-client won't build because the github runners don't have
  # TSCs. We don't care since we're not actually testing tracy functionality but
  # we still want to test with --all-features.
  TRACY_NO_INVARIANT_CHECK: 1

jobs:
  test:
    name: cargo test --all-features
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3  # v1.3.0
      - run: sudo apt-get install libwayland-dev libxkbcommon-dev cmake nasm
      - run: cargo test --all-features
      - name: Test x86 SIMD tiers & runtime dispatch
        run: |
          for flags in \
            "-C target-cpu=x86-64" \
            "-C target-cpu=x86-64 -C target-feature=+ssse3" \
            "-C target-cpu=x86-64-v2" \
            "-C target-cpu=x86-64-v2 -C target-feature=+avx"; do
            echo "=== Testing RUSTFLAGS=$flags ==="
            PROPTEST_CASES=16 RUSTFLAGS="$flags" cargo test --lib filtering
          done
      - name: Compile-check static AVX-512 x86 SIMD backend
        run: RUSTFLAGS="-C target-cpu=x86-64-v4 -C target-feature=+avx512vbmi" cargo test --target x86_64-unknown-linux-gnu --all-features --no-run

  miri:
    name: cargo +nightly miri test
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3  # v1.3.0
        with:
          components: miri
          channel: nightly
      - run: sudo apt-get install libwayland-dev libxkbcommon-dev cmake nasm
      - run: cargo +nightly miri test

  rustfmt:
    name: cargo +nightly fmt -- --check
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3  # v1.3.0
        with:
          components: rustfmt
          channel: nightly
      - run: cargo +nightly fmt -- --check

  cranky:
    name: cargo +nightly cranky --all-targets -- -D warnings
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3  # v1.3.0
        with:
          components: clippy
          bins: cargo-cranky@0.3.0
          channel: nightly
      - run: sudo apt-get install libwayland-dev libxkbcommon-dev cmake nasm
      - run: cargo +nightly cranky --all-targets -- -D warnings
      - name: Lint non-default x86 SIMD backends
        run: |
          for flags in \
            "-C target-cpu=x86-64" \
            "-C target-cpu=x86-64 -C target-feature=+ssse3" \
            "-C target-cpu=x86-64-v2" \
            "-C target-cpu=x86-64-v2 -C target-feature=+avx"; do
            echo "=== Linting RUSTFLAGS=$flags ==="
            RUSTFLAGS="$flags" cargo +nightly cranky --all-targets -- -D warnings
          done
          echo "=== Linting AVX-512 (target-only so host build scripts stay portable) ==="
          RUSTFLAGS="-C target-cpu=x86-64-v4 -C target-feature=+avx512vbmi" cargo +nightly cranky --target x86_64-unknown-linux-gnu --all-targets -- -D warnings

  test-aarch64:
    name: cargo test --all-features (aarch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3  # v1.3.0
      - run: sudo apt-get install libwayland-dev libxkbcommon-dev cmake
      - run: cargo test --all-features

  cranky-aarch64:
    name: cargo +nightly cranky --all-targets -- -D warnings (aarch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3  # v1.3.0
        with:
          components: clippy
          bins: cargo-cranky@0.3.0
          channel: nightly
      - run: sudo apt-get install libwayland-dev libxkbcommon-dev cmake
      - run: cargo +nightly cranky --all-targets -- -D warnings

  deny:
    name: cargo deny --all-features check licenses
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3  # v1.3.0
        with:
          bins: cargo-deny
      - run: cargo deny --all-features check licenses
