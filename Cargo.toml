[package]
name = "wprs"
version = "0.1.0"
authors = ["Nicolas Avrutin <rasputin@google.com>"]
license = "Apache-2.0"
edition = "2024"
build = "build.rs"

[profile.release-with-symbols]
inherits = "release"
debug = true

[profile.release-lto]
inherits = "release-with-symbols"
lto = true
codegen-units = 1

[profile.bench]
inherits = "release-lto"

[dependencies]
anyhow = "1.0.104"
bimap = "0.6.3"
bpaf = "0.9.29"
bytemuck = "1.25.2"
calloop = { version = "0.14.5", features = ["signals"] }
cfg-if = "1.0.5"
crossbeam-channel = "0.5.17"
enum-as-inner = "0.7.0"
home = "0.5.12"
itertools = "0.15.0"
nix = { version = "0.31.3", features = ["fs", "socket", "user"] }
num_enum = "0.7.6"
optional_struct = "0.5.2"
rkyv = { version = "0.8.18" }
ron = "0.12.3"
serde = "1.0.229"
serde_derive = "1.0.229"
serde_json = "1.0.154"
smithay = { version = "0.7.0", default-features = false, features = [
    "desktop",
    "xwayland",
    "wayland_frontend",
] }
smithay-client-toolkit = "0.21.1"
static_assertions = "1.1.0"
sysctl = "0.7.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["parking_lot"] }
tracing-tracy = { version = "0.12.0", optional = true, features = [
    "only-localhost",
    "ondemand",
] }
tracy-client = { version = "0.19.0", optional = true, features = [
    "only-localhost",
    "ondemand",
] }
turbojpeg = { version = "1.5.1", default-features = false, features = ["cmake", "require-simd"] }
whoami = "2.1.3"
x11rb = "0.14.0"
zstd = { version = "0.14.4" }

[build-dependencies]
merkle_hash = "3.9.0"

[features]
# Enables exporting data to the Tracy profiler.
# NOTE: opens a port on localhost.
# NOTE: breaks client reconnection due to sigpipe handling.
tracy = ["dep:tracy-client", "dep:tracing-tracy"]
# Enables memory allocation tracking for tracy. NOTE: severely decreases
# allocation performance.
tracy-allocator = ["tracy"]

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
png = "0.18.1"
proptest = "1.12.0"
trybuild = "1.0.122"

# To run this benchmark, uncomment the block below and specify a directory of
# images:
# WPRS_BENCH_IMAGE_DIR=/path/to/images cargo bench --bench image_compression
#
# A recommended set of images is the screenshot_web directory from
# qoi_benchmark_suite.tar on https://qoiformat.org/benchmark/. screenshot_web
# was chosen because it is relatively representative of general application
# GUIs, the kind of applications wprs is likely to be used with.

[[bench]]
name = "image_compression"
harness = false

[[bench]]
name = "serialize"
harness = false
